<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <a href="index.html" class="header_main-page">
        <svg class="main-icon">
          <use href="assets/svg/sprites.svg#main-icon"></use>
        </svg>
      </a>
      <nav class="header-menu">
        <ul class="header-menu_list">
          <li class="header-menu_list-item"><a href="index.html#favorite" class="list-item_link">Favorite coffee</a>
          </li>
          <li class="header-menu_list-item"><a href="index.html#about" class="list-item_link">About</a></li>
          <li class="header-menu_list-item"><a href="index.html#mobile-app" class="list-item_link">Mobile app</a></li>
          <li class="header-menu_list-item"><a href="index.html#contact-us" class="list-item_link">Contact us</a></li>
        </ul>
      </nav>
      <div class="header_theme-selector">
        <button class="theme-button button light">
          <svg class="sun-icon">
            <use href="assets/svg/sprites.svg#sun-icon"></use>
          </svg>
        </button>
        <button class="theme-button button dark">
          <svg class="moon-icon">
            <use href="assets/svg/sprites.svg#moon-icon"></use>
          </svg>
        </button>
      </div>
      <a href="menu.html" class="header_menu-button">
        <span>Menu</span>
        <svg class="cup-icon">
          <use href="assets/svg/sprites.svg#cup-icon"></use>
        </svg>
      </a>
    </header>
    <main class="main">
      <section class="catalogue-section">
        <h1 class="catalogue-section_title section_title title">Behind each of our cups hides an <span
            class="accent">amazing
            surprise</span>
        </h1>
        <div class="catalogue-section_buttons">
          <button class="catalogue-section_button button active">
            <img src="#" alt="Coffee">
            <span>Coffee</span>
          </button>
          <button class="catalogue-section_button button">
            <img src="#" alt="Tea">
            <span>Tea</span>
          </button>
          <button class="catalogue-section_button button">
            <img src="#" alt="Desserts">
            <span>Desserts</span>
          </button>
        </div>
        <div class="catalogue-cards">
          <div class="catalogue-card"></div>
          <div class="catalogue-card"></div>
          <div class="catalogue-card"></div>
          <div class="catalogue-card"></div>
          <div class="catalogue-card"></div>
          <div class="catalogue-card"></div>
          <div class="catalogue-card"></div>
          <div class="catalogue-card"></div>
        </div>
      </section>
    </main>
    <footer class="footer" id="contact-us">
      <div class="footer-container">
        <div class="deviz-container">
          <h2 class="deviz-container_title title section_title">Sip, Savor, Smile. <span class="accent">It's coffee
              time!</span></h2>
          <div class="social-buttons">
            <button class="button social-button">
              <svg class="twitter-icon">
                <use href="assets/svg/sprites.svg#twitter-icon"></use>
              </svg>
            </button>
            <button class="button social-button">
              <svg class="instagram-icon">
                <use href="assets/svg/sprites.svg#instagram-icon"></use>
              </svg>
            </button>
            <button class="button social-button">
              <svg class="facebook-icon">
                <use href="assets/svg/sprites.svg#facebook-icon"></use>
              </svg>
            </button>
          </div>
        </div>
        <div class="contacts-container">
          <h3 class="contacts-container_title title">Contact us</h3>
          <ul class="contacts-list">
            <li class="contact-item map">
              <svg class="map-icon">
                <use href="assets/svg/sprites.svg#map-icon"></use>
              </svg>
              <span>8558 Green Rd., LA</span>
            </li>
            <li class="contact-item phone">
              <svg class="phone-icon">
                <use href="assets/svg/sprites.svg#phone-icon"></use>
              </svg>
              <span>+1 (603) 555-0123</span>
            </li>
            <li class="contact-item worktime">
              <svg class="clock-icon">
                <use href="assets/svg/sprites.svg#clock-icon"></use>
              </svg>
              <span>Mon-Sat: 9:00-23:00</span>
            </li>
          </ul>
        </div>
      </div>
    </footer>

  </div>
</body>

</html>
